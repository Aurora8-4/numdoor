<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>排行榜样式预览</title>
<style>
  /* 390px 宽对应 750rpx，1rpx ≈ 0.52px */
  *{box-sizing:border-box;margin:0;padding:0}
  body{position:relative;width:390px;height:844px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:radial-gradient(120% 80% at 50% 0%,#1a0b38,#0a0518 60%,#05030c);color:#eaf6ff;overflow:hidden}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px}
  .title{font-size:54px;font-weight:900;letter-spacing:4px;line-height:1.1;color:#5fe3ff;text-shadow:0 0 21px rgba(90,225,255,.55)}
  .title2{font-size:54px;font-weight:900;letter-spacing:4px;color:#c46bff;text-shadow:0 0 21px rgba(196,107,255,.6);margin-top:2px}
  .sub{margin-top:9px;font-size:13px;letter-spacing:2px;color:#8fa8cc}

  .rank{margin-top:18px;width:100%;max-width:323px;padding:11px 12px 8px;border-radius:11px;
        background:rgba(120,190,255,.07);border:1px solid rgba(120,190,255,.16)}
  .rank-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .rank-title{font-size:15px;font-weight:800;letter-spacing:2px;color:#5fe3ff}
  .rank-tip{font-size:9px;color:#6f88a8}
  .rank-row{display:flex;align-items:center;padding:6px 0;border-top:1px solid rgba(120,190,255,.08)}
  .rank-no{width:23px;font-size:13px;font-weight:800;color:#6f88a8;text-align:center}
  .rank-no-top{color:#ffd83d}
  .rank-avatar{width:23px;height:23px;margin-right:7px;border-radius:50%;
               background:linear-gradient(180deg,#45d9ff,#1358c8);color:#03202e;
               font-size:11px;font-weight:800;text-align:center;line-height:23px}
  .rank-name{flex:1;font-size:13px;color:#cfe3ff}
  .rank-num{width:78px;text-align:right;font-size:14px;font-weight:800;color:#eafcff}
  .rank-stage{width:50px;text-align:right;font-size:10px;color:#8fa8cc}
  .rank-foot{padding-top:5px;text-align:right;font-size:9px;color:#55688a}

  .rules{margin-top:18px;width:100%;max-width:323px}
  .rule{padding:8px 10px;margin-bottom:6px;font-size:12px;color:#a9c0dd;border-radius:8px;
        background:rgba(120,190,255,.06);border:1px solid rgba(120,190,255,.13)}
  .hl{color:#5fe3ff;font-weight:700}
  .btn{margin-top:14px;padding:12px 38px;font-size:15px;font-weight:800;color:#04121c;border-radius:30px;
       background:linear-gradient(180deg,#a8f4ff,#33d3ff 55%,#1aa6e6);box-shadow:0 6px 20px rgba(50,200,255,.42)}
  .best{margin-top:10px;font-size:11px;color:#7f96b8}
</style>
</head>
<body>
<div class="screen">
  <div class="title">神也过不了</div>
  <div class="title2">第二关</div>
  <div class="sub">数字门 · 穿过数字门，把数字滚到最大</div>

  <div class="rank">
    <div class="rank-head">
      <span class="rank-title">排行榜</span>
      <span class="rank-tip">共 4 条记录</span>
    </div>
    <div class="rank-row">
      <span class="rank-no rank-no-top">1</span>
      <div class="rank-avatar">我</div>
      <span class="rank-name">我</span>
      <span class="rank-num">1.2M</span>
      <span class="rank-stage">9 关</span>
    </div>
    <div class="rank-row">
      <span class="rank-no rank-no-top">2</span>
      <div class="rank-avatar">我</div>
      <span class="rank-name">我</span>
      <span class="rank-num">33.8K</span>
      <span class="rank-stage">6 关</span>
    </div>
    <div class="rank-row">
      <span class="rank-no rank-no-top">3</span>
      <div class="rank-avatar">我</div>
      <span class="rank-name">我</span>
      <span class="rank-num">9800</span>
      <span class="rank-stage">4 关</span>
    </div>
    <div class="rank-row">
      <span class="rank-no">4</span>
      <div class="rank-avatar">我</div>
      <span class="rank-name">我</span>
      <span class="rank-num">171</span>
      <span class="rank-stage">2 关</span>
    </div>
    <div class="rank-foot">最高数字 · 关卡　|　好友榜需小游戏版本</div>
  </div>

  <div class="rules">
    <div class="rule">点屏幕 <span class="hl">左 / 中 / 右</span> 切换跑道</div>
    <div class="rule">穿过数字门 = 执行门上的 <span class="hl">+ × − ÷</span></div>
    <div class="rule">数字 <span class="hl">≥ 紫色 BOSS 门</span> 才能继续冲关</div>
  </div>

  <div class="btn">开始挑战</div>
  <div class="best">最高纪录 数字 <span class="hl">1.2M</span></div>
</div>
</body>
</html>

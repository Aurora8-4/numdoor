<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>神也过不了第二关 · 手机扫码开玩</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 80% at 50% 0%,#1a0b38,#0a0518 60%,#05030c);
    color:#eaf6ff;font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:24px}
  .card{max-width:560px;width:100%;text-align:center}
  h1{margin:0 0 6px;font-size:34px;letter-spacing:.06em;color:#5fe3ff;
    text-shadow:0 0 28px rgba(90,225,255,.5)}
  .sub{margin:0 0 22px;color:#8fa8cc;font-size:14px;letter-spacing:.06em}
  .qr{background:#fff;padding:16px;border-radius:20px;display:inline-block;
    box-shadow:0 18px 60px rgba(90,225,255,.28)}
  .qr img{display:block;width:min(72vw,300px);height:auto}
  .url{margin:18px 0 8px;font-size:17px;font-weight:700;color:#ffd83d;word-break:break-all;
    font-family:ui-monospace,Consolas,monospace}
  ol{text-align:left;max-width:460px;margin:18px auto 0;padding:18px 22px 18px 40px;
    background:rgba(120,190,255,.06);border:1px solid rgba(120,190,255,.13);border-radius:16px;
    font-size:13px;line-height:1.85;color:#a9c0dd}
  ol b{color:#5fe3ff}
  .tip{margin-top:16px;font-size:12px;color:#6f88a8;line-height:1.7}
</style>
</head>
<body>
<div class="card">
  <h1>神也过不了第二关</h1>
  <p class="sub">手机扫一扫 · 立刻开玩</p>

  <div class="qr"><img src="手机扫码-同一WiFi.png" alt="扫码"></div>

  <div class="url">http://10.137.135.79:8080/</div>

  <ol>
    <li>手机连上和电脑<b>同一个网络</b>（当前电脑连的是手机热点 iQOO）</li>
    <li>用<b>相机 / 微信 / 抖音</b>扫码，或直接在浏览器输入上面网址</li>
    <li>竖屏握持，<b>左右划一下</b>就切一格跑道；撞紫色 BOSS 门时数字要够大，<b>第二关是新人墙</b></li>
  </ol>

  <p class="tip">手机打不开时：确认没开 VPN、手机没在别的 Wi-Fi 上；<br>
  电脑端 IP 变了就重新生成二维码。</p>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#07040f" />
<title>神也过不了第二关</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{height:100vh;height:100dvh;margin:0;overflow:hidden;background:#05030c;color:#eaf6ff;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 80% at 50% 0%,#1a0b38 0%,#0a0518 55%,#05030c 100%)}
  #stage{position:relative;width:100%;height:100%;max-width:560px;overflow:hidden;
    box-shadow:0 0 90px rgba(120,60,255,.22)}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  .screen{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:26px;text-align:center;
    background:rgba(7,4,18,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:opacity .28s ease}
  .screen.hide{opacity:0;pointer-events:none}
  .screen h1{margin:0;font-size:clamp(38px,13vw,58px);letter-spacing:.06em;line-height:1;
    background:linear-gradient(180deg,#e9fdff 0%,#4fe0ff 42%,#c46bff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(90,225,255,.5))}
  .screen h2{margin:0;font-size:clamp(26px,8vw,34px);color:#ff9ab6;
    text-shadow:0 0 22px rgba(255,80,130,.55)}
  .sub{margin:0;font-size:14px;color:#8fa8cc;letter-spacing:.12em}
  .rules{list-style:none;margin:6px 0 2px;padding:0;max-width:360px;width:100%;
    display:flex;flex-direction:column;gap:9px}
  .rules li{font-size:13px;line-height:1.5;color:#a9c0dd;text-align:left;
    padding:9px 13px;border-radius:11px;background:rgba(120,190,255,.06);
    border:1px solid rgba(120,190,255,.13)}
  .rules b{color:#5fe3ff}
  .btn{margin-top:6px;border:0;cursor:pointer;font-family:inherit;font-weight:800;
    font-size:17px;letter-spacing:.14em;color:#04121c;padding:15px 42px;border-radius:999px;
    background:linear-gradient(180deg,#a8f4ff,#33d3ff 55%,#1aa6e6);
    box-shadow:0 8px 30px rgba(50,200,255,.42),inset 0 1px 0 rgba(255,255,255,.7);
    transition:transform .12s ease,box-shadow .12s ease}
  .btn:active{transform:scale(.96);box-shadow:0 4px 16px rgba(50,200,255,.35)}
  .best{margin-top:4px;font-size:13px;color:#7f96b8;letter-spacing:.08em}
  .best span{color:#ffd83d;font-weight:800}
  .stats{display:flex;gap:10px;width:100%;max-width:360px}
  .stats>div{flex:1;padding:12px 6px;border-radius:13px;background:rgba(120,190,255,.07);
    border:1px solid rgba(120,190,255,.16);display:flex;flex-direction:column;gap:5px}
  .stats span{font-size:11px;color:#8fa8cc;letter-spacing:.06em}
  .stats b{font-size:clamp(18px,5.4vw,22px);color:#eafcff;
    font-family:"Arial Black",Impact,system-ui,sans-serif}
  #btnSound{position:absolute;right:12px;bottom:12px;z-index:4;width:40px;height:40px;
    border-radius:50%;border:1px solid rgba(130,200,255,.22);cursor:pointer;
    background:rgba(20,12,44,.62);color:#bfe6ff;font-size:17px;line-height:1;
    display:grid;place-items:center;backdrop-filter:blur(6px)}
  #btnSound:active{transform:scale(.94)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <button id="btnSound" aria-label="声音">🔊</button>

  <div class="screen" id="startScreen">
    <h1>神也过不了<br>第二关</h1>
    <p class="sub">数字门 · 穿过数字门，把数字滚到最大</p>
    <ul class="rules">
      <li><b>← →</b> / <b>A D</b> / 点屏幕左中右 切换跑道</li>
      <li>穿过门 = 数字执行门上的运算 <b>+ × − ÷</b></li>
      <li>数字 <b>≥ 紫色 BOSS 门</b> 的数值才能继续冲关</li>
    </ul>
    <button class="btn" id="btnStart">开始挑战</button>
    <div class="best">最高纪录：数字 <span id="bestStart">1</span></div>
  </div>

  <div class="screen hide" id="overScreen">
    <h2 id="overTitle">门太硬了</h2>
    <div class="stats">
      <div><span>最大数字</span><b id="sNum">0</b></div>
      <div><span>通过关卡</span><b id="sStage">0</b></div>
      <div><span>最高纪录</span><b id="sBest">0</b></div>
    </div>
    <button class="btn" id="btnRetry">再来一次</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ========================= 基础 ========================= */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var startScreen = document.getElementById('startScreen');
var overScreen  = document.getElementById('overScreen');
var btnStart    = document.getElementById('btnStart');
var btnRetry    = document.getElementById('btnRetry');
var btnSound    = document.getElementById('btnSound');
var sNum   = document.getElementById('sNum');
var sStage = document.getElementById('sStage');
var sBest  = document.getElementById('sBest');
var bestStart = document.getElementById('bestStart');
var overTitle = document.getElementById('overTitle');

var LANE_X = [-1.5, 0, 1.5];
var LANE_W = 1.42;
var PLAYER_Z = 5.4;
var NEAR = 3.2, FAR = 48, GAP = 6.2, BOSS_EVERY = 4;
var LANE_DUR = 0.06;      // 切道动画时长（秒）：越小越跟手
var FONT = "'Arial Black', Impact, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif";

var W = 0, H = 0, DPR = 1, horizon = 0, unit = 0, stars = [];

var mode = 'ready';
var G = null;
var muted = false;
var best = { num: 1, stage: 0 };
try {
  var raw = localStorage.getItem('numdoor.best');
  if (raw) {
    var p = JSON.parse(raw);
    if (p && typeof p.num === 'number') best.num = p.num;
    if (p && typeof p.stage === 'number') best.stage = p.stage;
  }
} catch (e) {}

/* ========================= 音效 ========================= */
var AC = null;
function ac(){
  if (AC) return AC;
  try {
    var C = window.AudioContext || window.webkitAudioContext;
    if (C) AC = new C();
  } catch (e) { AC = null; }
  return AC;
}
function tone(freq, dur, type, vol, slideTo){
  if (muted) return;
  var a = ac();
  if (!a) return;
  try {
    if (a.state === 'suspended' && a.resume) a.resume();
    var t0 = a.currentTime;
    var o = a.createOscillator();
    var gn = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.linearRampToValueAtTime(vol || 0.1, t0 + 0.012);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn); gn.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch (e) {}
}

/* ========================= 布局 / 透视 ========================= */
function layout(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth || window.innerWidth || 400;
  H = cv.clientHeight || window.innerHeight || 640;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  horizon = H * 0.30;
  unit = Math.min(W * 0.34, H * 0.62);
  stars = [];
  var n = Math.round(W * H / 9000);
  for (var i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * horizon * 0.95,
      r: Math.random() * 1.5 + 0.4,
      a: Math.random() * 0.55 + 0.15,
      ph: Math.random() * 6.28
    });
  }
}
function sc(z){ return NEAR / Math.max(z, 0.6); }
function groundY(z){
  var q = (1 / z - 1 / FAR) / (1 / NEAR - 1 / FAR);
  return horizon + (H * 1.06 - horizon) * q;
}
function px(x, z){ return W / 2 + x * unit * sc(z); }

/* ========================= 工具 ========================= */
function fmt(n){
  n = Math.max(0, Math.round(n));
  if (n < 10000) return String(n);
  var U = [[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']];
  for (var i = 0; i < U.length; i++){
    var v = U[i][0];
    if (n >= v){
      var q = n / v;
      if (q >= 10000) break;
      var s = q >= 100 ? q.toFixed(0) : q.toFixed(1).replace(/\.0$/, '');
      return s + U[i][1];
    }
  }
  var e = Math.floor(Math.log(n) / Math.LN10);
  var m = n / Math.pow(10, e);
  return m.toFixed(1).replace(/\.0$/, '') + 'e' + e;
}
function rr(x, y, w, h, r){
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function buzz(p){
  try { if (navigator && navigator.vibrate) navigator.vibrate(p); } catch (e) {}
}

var COL = {
  '+': { c: '#38e3ff', soft: 'rgba(56,227,255,', deep: '#0d3d4e' },
  '×': { c: '#ffd83d', soft: 'rgba(255,216,61,', deep: '#4a3400' },
  '-': { c: '#ff5577', soft: 'rgba(255,85,119,', deep: '#4a0c1e' },
  '÷': { c: '#ff8a3d', soft: 'rgba(255,138,61,', deep: '#4a2000' },
  'boss': { c: '#c46bff', soft: 'rgba(196,107,255,', deep: '#33084d' }
};

/* ========================= 游戏状态 ========================= */
function newGame(){
  G = {
    num: 1, maxNum: 1, stage: 1,
    lane: 1, px: LANE_X[1], laneFrom: LANE_X[1], laneT: 1,
    worldZ: 0, speed: 12.5,   // 第一关慢慢来
    gates: [], sinceBoss: 0, target: 12, gentleLeft: 0,
    t: 0, shake: 0, flash: 0, pop: 0,
    particles: [], floaters: []
  };
}

function spawnGate(){
  var need = G.stage <= 1 ? 6 : BOSS_EVERY;   // 第一关多给一段跑道，第二关开始上强度
  if (G.sinceBoss >= need){
    G.gates.push({
      z: FAR, boss: true, target: G.target, checked: false,
      doors: [{ lane: 0, op: 'boss' }, { lane: 1, op: 'boss' }, { lane: 2, op: 'boss' }]
    });
    G.sinceBoss = 0;
    return;
  }
  var gentle = G.gentleLeft > 0;
  if (gentle) G.gentleLeft--;
  G.gates.push(makeRow(FAR, gentle));
  G.sinceBoss++;
}

function makeRow(z, gentle){
  var n = G.num;
  var behind = n < G.target * 0.45;

  // 一行只有一扇好门，另外两扇是坑：选慢半拍就是掉数字
  var good;
  if (!gentle && Math.random() < (behind ? 0.22 : 0.30)) good = { op: '×', val: 2 };
  else good = { op: '+', val: Math.max(3, Math.round(n * (behind ? 0.30 : 0.24)) + 1) };

  var bad1, bad2;
  if (gentle){
    bad1 = { op: '+', val: Math.max(2, Math.round(n * 0.12) + 1) };
    bad2 = { op: '+', val: Math.max(2, Math.round(n * 0.10) + 1) };
  } else {
    bad1 = { op: '-', val: Math.max(3, Math.round(n * (behind ? 0.28 : 0.38))) };
    bad2 = (n >= 10 && Math.random() < 0.5)
      ? { op: '÷', val: 2 }
      : { op: '-', val: Math.max(3, Math.round(n * (behind ? 0.20 : 0.26))) };
  }

  var ops = [good, bad1, bad2];
  for (var i = ops.length - 1; i > 0; i--){
    var j = (Math.random() * (i + 1)) | 0;
    var tmp = ops[i]; ops[i] = ops[j]; ops[j] = tmp;
  }

  var lanes = [0, 1, 2];
  if (!gentle && Math.random() < 0.18){
    // 偶尔有个空门缝：不挨刀，但也没收益，等于原地踏步
    // 只丢坏门，保证每行至少留一扇能涨的门（否则会出现无解行）
    var gi = ops.indexOf(good);
    var cand = [0, 1, 2].filter(function(i){ return i !== gi; });
    var dropIdx = cand[(Math.random() * cand.length) | 0];
    ops.splice(dropIdx, 1);
    lanes.splice(dropIdx, 1);
  }
  var doors = lanes.map(function(l, k){
    return { lane: l, op: ops[k].op, val: ops[k].val };
  });
  return { z: z, boss: false, doors: doors, checked: false };
}

function playerCenter(){
  var s = sc(PLAYER_Z);
  var R = 0.56 * unit * s;
  var bob = Math.sin(G.t * 11) * R * 0.09;
  return { x: px(G.px, PLAYER_Z), y: groundY(PLAYER_Z) - R * 1.06 + bob, r: R };
}

function resolve(gate){
  if (gate.boss){
    if (G.num >= gate.target) bossWin(gate);
    else bossFail(gate);
    return;
  }
  var d = null;
  for (var i = 0; i < gate.doors.length; i++){
    if (gate.doors[i].lane === G.lane){ d = gate.doors[i]; break; }
  }
  if (!d){
    var pc0 = playerCenter();
    floatText('空门', pc0.x, pc0.y - pc0.r * 1.95, '#8fa8cc', 0.8);
    return;
  }
  applyOp(d);
}

function applyOp(d){
  var before = G.num;
  var good = true;
  if (d.op === '+') G.num = G.num + d.val;
  else if (d.op === '×') G.num = G.num * d.val;
  else if (d.op === '-') G.num = Math.max(0, G.num - d.val);
  else if (d.op === '÷') G.num = Math.floor(G.num / d.val);

  if (G.num < before) good = false;
  if (G.num > G.maxNum) G.maxNum = G.num;

  var col = COL[d.op] || COL['+'];
  var pc = playerCenter();
  var sx = pc.x;
  var sy = pc.y - pc.r * 1.95;
  floatText(d.op + d.val, sx, sy, good ? col.c : '#ff5577', good ? 1 : 0.85);
  burst(sx, sy, good ? 16 : 11, good ? col.c : '#ff5577', good ? 1 : 0.8);
  if (good){
    G.shake = Math.min(0.5, G.shake + 0.16);
    G.pop = Math.min(1, G.pop + 0.9);
    buzz(10);
    tone(d.op === '×' ? 660 : 520, 0.10, 'triangle', 0.10, d.op === '×' ? 1180 : 880);
    if (d.op === '×') setTimeout(function(){ tone(990, 0.10, 'triangle', 0.09, 1320); }, 55);
  } else {
    G.shake = Math.min(1, G.shake + 0.55);
    G.pop = Math.min(1, G.pop + 0.5);
    buzz([18, 30, 18]);
    tone(240, 0.16, 'sawtooth', 0.09, 90);
  }
}

function bossWin(gate){
  G.stage++;
  G.sinceBoss = 0;
  var mult = G.stage === 2 ? 2.75 : 2.15;   // 第二关是新人墙：这里门槛抬高
  G.target = Math.ceil(Math.max(12, G.num * mult));
  G.speed = G.stage <= 1 ? 12.5 : Math.min(26, 20.5 + (G.stage - 2) * 1.0);   // 第二关直接拉起来
  G.flash = 0.85;
  G.shake = 1.1;
  var pcw = playerCenter();
  var cx = pcw.x, cy = pcw.y - pcw.r * 1.95;
  floatText('第 ' + (G.stage - 1) + ' 关 通过', cx, cy, '#7dffb0', 1.4);
  burst(cx, cy, 54, '#7dffb0', 1.5);
  tone(520, 0.10, 'square', 0.10, 780);
  setTimeout(function(){ tone(780, 0.12, 'square', 0.10, 1180); }, 90);
  setTimeout(function(){ tone(1180, 0.18, 'square', 0.09, 1560); }, 190);
}

function bossFail(gate){
  G.shake = 1.5;
  G.flash = 0.5;
  G.pop = 1;
  buzz([25, 45, 90]);
  var pcf = playerCenter();
  var cx = pcf.x, cy = pcf.y - pcf.r * 1.9;
  floatText('需要 ' + fmt(gate.target), cx, cy, '#ff5577', 1.3);
  burst(cx, cy, 34, '#ff5577', 1.2);
  gameOver();
}

function gameOver(){
  if (mode === 'over') return;
  mode = 'over';
  tone(300, 0.55, 'sawtooth', 0.14, 60);
  var passed = G.stage - 1;
  if (G.num > best.num) best.num = G.num;
  if (passed > best.stage) best.stage = passed;
  try { localStorage.setItem('numdoor.best', JSON.stringify(best)); } catch (e) {}
  sNum.textContent = fmt(G.maxNum);
  sStage.textContent = passed;
  sBest.textContent = fmt(best.num);
  overTitle.textContent = passed >= 6 ? '差一点点！' : '门太硬了';
  setTimeout(function(){
    if (mode === 'over') overScreen.classList.remove('hide');
  }, 700);
}

/* ========================= 特效 ========================= */
function burst(x, y, n, color, power){
  for (var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2;
    var sp = (60 + Math.random() * 300) * (power || 1);
    G.particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 90,
      life: 0.45 + Math.random() * 0.5,
      max: 1,
      size: 1.6 + Math.random() * 3.4,
      color: color
    });
  }
}
function floatText(text, x, y, color, size){
  G.floaters.push({ text: text, x: x, y: y, color: color, life: 1, size: size || 1 });
}

/* ========================= 更新 ========================= */
function updateLane(dt){
  // 定时补间 + 三次缓出：90ms 内硬切到位，手感干脆不拖泥带水
  if (G.laneT < 1){
    G.laneT = Math.min(1, G.laneT + dt / LANE_DUR);
  }
  var e = 1 - Math.pow(1 - G.laneT, 3);
  G.px = G.laneFrom + (LANE_X[G.lane] - G.laneFrom) * e;
}

function update(dt){
  if (!G) return;

  if (mode === 'ready'){
    G.worldZ += 6.0 * dt;
    G.t += dt;
    updateLane(dt);
  } else if (mode === 'play'){
    G.t += dt;
    G.worldZ += G.speed * dt;

    updateLane(dt);

    for (var i = 0; i < G.gates.length; i++){
      var gate = G.gates[i];
      var prevZ = gate.z;
      gate.z -= G.speed * dt;
      if (!gate.checked && prevZ > PLAYER_Z && gate.z <= PLAYER_Z){
        gate.checked = true;
        resolve(gate);
        if (mode !== 'play') break;
      }
    }
    if (mode === 'play'){
      G.gates = G.gates.filter(function(g){ return g.z > NEAR + 1.0; });
      var last = G.gates[G.gates.length - 1];
      if (!last || last.z < FAR - GAP) spawnGate();
    }
  }

  G.shake = Math.max(0, G.shake - dt * 2.4);
  G.flash = Math.max(0, G.flash - dt * 2.2);
  G.pop = Math.max(0, G.pop - dt * 5.2);

  for (var p = G.particles.length - 1; p >= 0; p--){
    var pt = G.particles[p];
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.vy += 780 * dt;
    pt.vx *= 0.985;
    pt.life -= dt;
    if (pt.life <= 0) G.particles.splice(p, 1);
  }
  for (var f = G.floaters.length - 1; f >= 0; f--){
    var ft = G.floaters[f];
    ft.y -= 74 * dt;
    ft.life -= dt * 0.95;
    if (ft.life <= 0) G.floaters.splice(f, 1);
  }
}

/* ========================= 绘制：背景 ========================= */
function drawBackground(){
  var g = ctx.createLinearGradient(0, 0, 0, horizon + 2);
  g.addColorStop(0, '#070417');
  g.addColorStop(0.5, '#1b0a3a');
  g.addColorStop(1, '#4a1166');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, horizon + 2);

  var cx = W / 2, cy = horizon - 2, R = Math.min(W * 0.30, H * 0.25);

  var sg = ctx.createRadialGradient(cx, cy, R * 0.1, cx, cy, R * 1.55);
  sg.addColorStop(0, 'rgba(255,150,230,0.42)');
  sg.addColorStop(0.5, 'rgba(190,60,220,0.16)');
  sg.addColorStop(1, 'rgba(190,60,220,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(cx, cy, R * 1.55, 0, 6.284); ctx.fill();

  var dg = ctx.createLinearGradient(0, cy - R * 0.6, 0, cy + R * 0.2);
  dg.addColorStop(0, '#ffe9a8');
  dg.addColorStop(0.5, '#ff7ad0');
  dg.addColorStop(1, '#7a1fb0');
  ctx.fillStyle = dg;
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.58, Math.PI, 0); ctx.closePath(); ctx.fill();

  for (var i = 0; i < stars.length; i++){
    var s = stars[i];
    var tw = 0.65 + 0.35 * Math.sin((G ? G.t : 0) * 2 + s.ph);
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = '#dff4ff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.284); ctx.fill();
  }
  ctx.globalAlpha = 1;

  var hg = ctx.createLinearGradient(0, horizon - 3, 0, horizon + 5);
  hg.addColorStop(0, 'rgba(255,120,230,0)');
  hg.addColorStop(0.5, 'rgba(255,140,240,0.85)');
  hg.addColorStop(1, 'rgba(120,40,180,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, horizon - 3, W, 8);

  var gg = ctx.createLinearGradient(0, horizon, 0, H);
  gg.addColorStop(0, '#1a0a30');
  gg.addColorStop(0.45, '#0c0518');
  gg.addColorStop(1, '#05030c');
  ctx.fillStyle = gg;
  ctx.fillRect(0, horizon, W, H - horizon);
}

function drawRoad(){
  var yN = groundY(NEAR), yF = groundY(FAR);
  var lN = px(-2.5, NEAR), rN = px(2.5, NEAR);
  var lF = px(-2.5, FAR),  rF = px(2.5, FAR);

  var g = ctx.createLinearGradient(0, yF, 0, yN);
  g.addColorStop(0, '#22103f');
  g.addColorStop(0.35, '#150a29');
  g.addColorStop(1, '#0a0417');
  ctx.beginPath();
  ctx.moveTo(lN, yN); ctx.lineTo(lF, yF); ctx.lineTo(rF, yF); ctx.lineTo(rN, yN);
  ctx.closePath();
  ctx.fillStyle = g;
  ctx.fill();

  var edges = [[lN, yN, lF, yF], [rN, yN, rF, yF]];
  for (var i = 0; i < 2; i++){
    var e = edges[i];
    ctx.beginPath();
    ctx.moveTo(e[0], e[1]); ctx.lineTo(e[2], e[3]);
    ctx.lineWidth = 7;
    ctx.strokeStyle = 'rgba(80,220,255,0.09)';
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(120,235,255,0.72)';
    ctx.stroke();
  }
}

function drawStripes(){
  var P = 6, HALF = 2.7;
  var off = (G ? G.worldZ : 0) % P;
  ctx.fillStyle = 'rgba(120,225,255,0.17)';
  for (var k = 0; k < 14; k++){
    var z1 = NEAR + k * P - off;
    var z2 = z1 + HALF;
    if (z2 <= NEAR + 0.2 || z1 >= FAR) continue;
    z1 = Math.max(z1, NEAR + 0.2);
    z2 = Math.min(z2, FAR);
    if (z2 <= z1) continue;
    var y1 = groundY(z1), y2 = groundY(z2);
    for (var li = 0; li < 2; li++){
      var lx = li === 0 ? -0.76 : 0.76;
      var a = px(lx, z1), b = px(lx, z2);
      var w1 = 0.075 * unit * sc(z1), w2 = 0.075 * unit * sc(z2);
      ctx.beginPath();
      ctx.moveTo(a - w1, y1); ctx.lineTo(a + w1, y1);
      ctx.lineTo(b + w2, y2); ctx.lineTo(b - w2, y2);
      ctx.closePath(); ctx.fill();
    }
  }
}

/* ========================= 绘制：门 ========================= */
function drawGate(gate){
  var z = gate.z;
  if (z < NEAR + 0.9) return;
  var s = sc(z), gy = groundY(z);
  var alpha = 1;
  if (z < PLAYER_Z) alpha = clamp((z - (NEAR + 0.9)) / (PLAYER_Z - (NEAR + 0.9)), 0, 1);
  else if (z < PLAYER_Z + 2.8) alpha = 0.26 + 0.74 * (z - PLAYER_Z) / 2.8;
  if (alpha <= 0.03) return;

  ctx.save();
  ctx.globalAlpha = alpha;

  for (var i = 0; i < gate.doors.length; i++){
    var d = gate.doors[i];
    var cx = px(LANE_X[d.lane], z);
    var hw = (LANE_W / 2) * unit * s;
    var hh = (gate.boss ? 2.6 : 1.95) * unit * s;
    var x = cx - hw, y = gy - hh, w = hw * 2, h = hh;

    var key = gate.boss ? 'boss' : d.op;
    var col = COL[key] || COL['+'];
    var ok = gate.boss && G.num >= gate.target;
    var c1 = ok ? '#7dffb0' : col.c;
    var soft = ok ? 'rgba(125,255,176,' : col.soft;

    // 光晕
    ctx.lineWidth = Math.max(2, hw * 0.28);
    ctx.strokeStyle = soft + '0.13)';
    rr(x, y, w, h, hw * 0.34);
    ctx.stroke();

    // 门体
    var fg = ctx.createLinearGradient(0, y, 0, y + h);
    fg.addColorStop(0, soft + '0.34)');
    fg.addColorStop(0.62, soft + '0.16)');
    fg.addColorStop(1, soft + '0.03)');
    ctx.fillStyle = fg;
    rr(x, y, w, h, hw * 0.34);
    ctx.fill();

    // 边框
    ctx.lineWidth = Math.max(1.4, hw * 0.10);
    ctx.strokeStyle = soft + '0.92)';
    rr(x, y, w, h, hw * 0.34);
    ctx.stroke();

    // 内部横纹
    ctx.lineWidth = Math.max(1, hw * 0.05);
    ctx.strokeStyle = soft + '0.30)';
    ctx.beginPath();
    ctx.moveTo(x + w * 0.16, y + h * 0.14);
    ctx.lineTo(x + w * 0.84, y + h * 0.14);
    ctx.stroke();

    // 门楣高光
    ctx.fillStyle = soft + '0.85)';
    rr(x + w * 0.10, y - h * 0.055, w * 0.80, Math.max(2, h * 0.05), h * 0.03);
    ctx.fill();

    // 文本
    var label;
    if (gate.boss) label = '≥' + fmt(gate.target);
    else label = d.op + d.val;

    var fs = h * 0.40;
    var fontStr = '900 ' + fs + 'px ' + FONT;
    ctx.font = fontStr;
    while (ctx.measureText(label).width > w * 0.80 && fs > 7){
      fs *= 0.92;
      fontStr = '900 ' + fs + 'px ' + FONT;
      ctx.font = fontStr;
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillText(label, cx, y + h * 0.53 + Math.max(1, fs * 0.06));
    ctx.fillStyle = c1;
    ctx.fillText(label, cx, y + h * 0.52);

    if (gate.boss){
      var tagFs = Math.max(7, h * 0.11);
      ctx.font = '900 ' + tagFs + 'px ' + FONT;
      ctx.fillStyle = soft + '0.95)';
      ctx.fillText(ok ? '✓ 可击破' : 'BOSS', cx, y + h * 0.86);
    }
  }
  ctx.restore();
}

/* ========================= 绘制：角色 ========================= */
function drawPlayer(){
  var pc = playerCenter();
  var gy = groundY(PLAYER_Z);
  var cx = pc.x, cy = pc.y, R = pc.r * (1 + 0.18 * G.pop);

  ctx.save();
  ctx.globalAlpha = 0.42;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx, gy + R * 0.06, R * 0.86, R * 0.26, 0, 0, 6.284);
  ctx.fill();
  ctx.restore();

  var gr = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 2);
  gr.addColorStop(0, 'rgba(110,240,255,0.30)');
  gr.addColorStop(1, 'rgba(110,240,255,0)');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(cx, cy, R * 2, 0, 6.284); ctx.fill();

  // 切道时的横向拉伸：让"甩过去"有物理感
  var stretch = 1 + 0.16 * Math.sin(Math.PI * Math.min(1, G.laneT));
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(stretch, 2 - stretch);

  var bg = ctx.createRadialGradient(-R * 0.34, -R * 0.44, R * 0.08, 0, 0, R * 1.18);
  bg.addColorStop(0, '#e8feff');
  bg.addColorStop(0.42, '#45d9ff');
  bg.addColorStop(1, '#1358c8');
  ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.284);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.lineWidth = Math.max(1.6, R * 0.085);
  ctx.strokeStyle = 'rgba(225,255,255,0.9)';
  ctx.stroke();

  var txt = fmt(G.num);
  var nf = R * 0.95;
  ctx.font = '900 ' + nf + 'px ' + FONT;
  while (ctx.measureText(txt).width > R * 1.55 && nf > 6){
    nf *= 0.9;
    ctx.font = '900 ' + nf + 'px ' + FONT;
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#03202e';
  ctx.fillText(txt, 0, R * 0.05);
  ctx.restore();
}

/* ========================= 绘制：特效 ========================= */
function drawEffects(){
  for (var i = 0; i < G.particles.length; i++){
    var p = G.particles[i];
    var a = clamp(p.life * 1.6, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (0.4 + a * 0.8), 0, 6.284);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (var f = 0; f < G.floaters.length; f++){
    var t = G.floaters[f];
    var la = clamp(t.life, 0, 1);
    ctx.globalAlpha = la;
    var fs = 22 * t.size * (0.7 + la * 0.5);
    ctx.font = '900 ' + fs + 'px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(2, fs * 0.14);
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

/* ========================= 绘制：HUD ========================= */
function chip(x, y, w, h){
  ctx.fillStyle = 'rgba(14,9,30,0.62)';
  rr(x, y, w, h, 13);
  ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(120,200,255,0.16)';
  rr(x, y, w, h, 13);
  ctx.stroke();
}

function drawHUD(){
  var pad = 12;
  var big = Math.min(W, H) < 420;
  var cw = Math.min(148, W * 0.44), chh = big ? 54 : 62;

  ctx.save();
  ctx.textBaseline = 'alphabetic';

  // 左：当前数字
  chip(pad, pad, cw, chh);
  ctx.textAlign = 'left';
  ctx.font = '600 ' + (big ? 10 : 11) + 'px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(160,215,255,0.62)';
  ctx.fillText('当前数字', pad + 12, pad + (big ? 17 : 19));
  ctx.font = '900 ' + (big ? 24 : 28) + 'px ' + FONT;
  ctx.fillStyle = '#eafcff';
  ctx.fillText(fmt(G.num), pad + 12, pad + chh - (big ? 12 : 14));

  // 右：目标 / 关卡
  var rx = W - pad - cw;
  chip(rx, pad, cw, chh);
  ctx.textAlign = 'right';
  ctx.font = '600 ' + (big ? 10 : 11) + 'px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(160,215,255,0.62)';
  ctx.fillText('目标 ≥', rx + cw - 12, pad + (big ? 17 : 19));
  ctx.font = '900 ' + (big ? 24 : 28) + 'px ' + FONT;
  ctx.fillStyle = G.num >= G.target ? '#7dffb0' : '#ffb347';
  ctx.fillText(fmt(G.target), rx + cw - 12, pad + chh - (big ? 12 : 14));

  // 进度条
  var bx = pad, by = pad + chh + 7, bw = W - pad * 2, bh = 4;
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  rr(bx, by, bw, bh, bh / 2); ctx.fill();
  var ratio = clamp(G.num / Math.max(1, G.target), 0, 1);
  var pg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  pg.addColorStop(0, '#38e3ff');
  pg.addColorStop(1, ratio >= 1 ? '#7dffb0' : '#ffd83d');
  ctx.fillStyle = pg;
  rr(bx, by, Math.max(bh, bw * ratio), bh, bh / 2);
  ctx.fill();

  // 关卡
  ctx.textAlign = 'center';
  ctx.font = '700 ' + (big ? 10 : 11) + 'px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(200,220,255,0.72)';
  ctx.fillText('第 ' + G.stage + ' 关', W / 2, pad + (big ? 15 : 16));

  // 最高
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '600 11px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(140,170,205,0.6)';
  ctx.fillText('最高 ' + fmt(best.num), pad, H - pad);

  ctx.restore();
}

/* ========================= 渲染入口 ========================= */
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  var shake = G ? G.shake : 0;
  ctx.save();
  if (shake > 0.01){
    ctx.translate((Math.random() - 0.5) * shake * 16, (Math.random() - 0.5) * shake * 16);
  }
  drawBackground();
  drawRoad();
  drawStripes();

  if (G){
    var i;
    for (i = G.gates.length - 1; i >= 0; i--){
      if (G.gates[i].z > PLAYER_Z) drawGate(G.gates[i]);
    }
    drawPlayer();
    for (i = G.gates.length - 1; i >= 0; i--){
      if (G.gates[i].z <= PLAYER_Z) drawGate(G.gates[i]);
    }
    drawEffects();
  }
  ctx.restore();

  if (G) drawHUD();

  if (G && G.flash > 0.01){
    ctx.fillStyle = 'rgba(255,255,255,' + (G.flash * 0.45).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ========================= 输入 ========================= */
function setLane(l){
  if (mode !== 'play' || !G) return;
  l = clamp(l | 0, 0, 2);
  if (l !== G.lane){
    G.laneFrom = G.px;
    G.laneT = 0;
    G.lane = l;
    G.lean = LANE_X[l] > G.px ? 1 : -1;
    tone(980, 0.035, 'square', 0.03, 1250);
  }
}

function laneFromClientX(clientX){
  var rect = cv.getBoundingClientRect();
  var rel = (clientX - rect.left) / Math.max(1, rect.width);
  if (rel < 0.36) return 0;
  if (rel > 0.64) return 2;
  return 1;
}

window.addEventListener('keydown', function(e){
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A'){ setLane(G ? G.lane - 1 : 1); e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D'){ setLane(G ? G.lane + 1 : 1); e.preventDefault(); }
  else if (k === '1'){ setLane(0); }
  else if (k === '2'){ setLane(1); }
  else if (k === '3'){ setLane(2); }
  else if (k === ' ' || k === 'Enter'){
    if (mode !== 'play'){ start(); e.preventDefault(); }
  }
});

var dragging = false;
var swipeDone = false;     // 一次手势只允许切一格
var touchAnchorX = 0;
var touchDownX = 0;
var touchDownT = 0;
var SWIPE = 16;            // 滑动超过 16px 立刻切一格

cv.addEventListener('pointerdown', function(e){
  e.preventDefault();
  dragging = true;
  swipeDone = false;
  touchAnchorX = e.clientX;
  touchDownX = e.clientX;
  touchDownT = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  if (mode !== 'play' && e.pointerType === 'touch') start();
});

cv.addEventListener('pointermove', function(e){
  if (!dragging || mode !== 'play' || !G) return;
  e.preventDefault();
  if (swipeDone) return;                     // 本次手势已经切过，不再响应
  var dx = e.clientX - touchAnchorX;
  if (Math.abs(dx) >= SWIPE){
    setLane(G.lane + (dx > 0 ? 1 : -1));     // 只切一格，不连跳
    swipeDone = true;
  }
}, { passive: false });

cv.addEventListener('pointerup', function(e){
  if (!dragging) return;
  dragging = false;
  if (mode !== 'play' || !G || swipeDone) return;
  // 没滑动 = 轻点，按区域直接跳到对应跑道
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  if (now - touchDownT < 320 && Math.abs(e.clientX - touchDownX) < 12){
    setLane(laneFromClientX(e.clientX));
  }
});
cv.addEventListener('pointercancel', function(){ dragging = false; swipeDone = true; });
cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

overScreen.addEventListener('pointerdown', function(){ if (mode === 'over') start(); });   // 结算页点哪儿都能立刻重开
btnStart.addEventListener('click', function(){ start(); });
btnRetry.addEventListener('click', function(){ start(); });
btnSound.addEventListener('click', function(){
  muted = !muted;
  btnSound.textContent = muted ? '🔇' : '🔊';
  if (!muted) tone(760, 0.09, 'triangle', 0.09, 980);
});

/* ========================= 流程 ========================= */
function start(){
  newGame();
  // 起手预置三道门，开局 2~3 秒就能吃到第一个（不用干等）
  for (var i = 0; i < 2; i++){
    G.gates.push(makeRow(28 + i * 6.4));
    G.sinceBoss++;
  }
  G.gentleLeft = 0;   // 硬核模式：开局就上负门
  mode = 'play';
  startScreen.classList.add('hide');
  overScreen.classList.add('hide');
  bestStart.textContent = fmt(best.num);
  tone(560, 0.10, 'triangle', 0.10, 880);
  setTimeout(function(){ tone(880, 0.12, 'triangle', 0.08, 1180); }, 80);
}

/* ========================= 主循环 ========================= */
var last = 0;
function frame(now){
  if (!last) last = now;
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ========================= 启动 ========================= */
layout();
newGame();
bestStart.textContent = fmt(best.num);
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', function(){ setTimeout(layout, 220); });
requestAnimationFrame(frame);

/* 调试接口（无副作用的只读钩子，便于自动化验证） */
if (typeof window !== 'undefined'){
  window.__dd = {
    newGame: newGame,
    start: start,
    update: update,
    render: render,
    layout: layout,
    setLane: setLane,
    get mode(){ return mode; },
    get data(){ return G; }
  };
}

})();
</script>
</body>
